basePath: /
definitions:
  girlfriend-backend_internal_domain_model.Memory:
    properties:
      generated_prompt:
        type: string
      id:
        type: string
      occurred_at:
        type: string
      partner_id:
        type: string
      scenario_id:
        type: string
    type: object
  girlfriend-backend_internal_domain_model.Partner:
    properties:
      current_stage:
        type: string
      hair_color:
        type: string
      id:
        type: string
      intelligence:
        type: integer
      name:
        type: string
      personality:
        type: string
      sense:
        type: integer
      stamina:
        type: integer
      user_id:
        type: string
      voice_type:
        type: string
    type: object
  girlfriend-backend_internal_domain_model.SleepLog:
    properties:
      id:
        type: string
      partner_id:
        type: string
      sleep_minutes:
        description: 同上
        type: integer
      slept_at:
        type: string
      user_id:
        type: string
      wake_at:
        description: まだ起きてない時はNULLなのでポインタ
        type: string
    type: object
  internal_interface_handler.CreatePartnerRequest:
    properties:
      hair_color:
        type: string
      name:
        type: string
      personality:
        type: string
      user_id:
        type: string
      voice_type:
        type: string
    type: object
  internal_interface_handler.SleepRequest:
    properties:
      partner_id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 美少女育成ゲームのバックエンドAPIです。
  title: Girlfriend Backend API
  version: "1.0"
paths:
  /partners:
    post:
      consumes:
      - application/json
      description: 新しいパートナーを作成し、初期ステータスを登録します
      parameters:
      - description: 作成情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interface_handler.CreatePartnerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/girlfriend-backend_internal_domain_model.Partner'
      summary: パートナー新規作成
      tags:
      - partners
  /partners/{id}:
    get:
      consumes:
      - application/json
      description: 指定されたIDのパートナーのステータス情報を返します
      parameters:
      - description: Partner ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/girlfriend-backend_internal_domain_model.Partner'
      summary: パートナー情報の取得
      tags:
      - partners
  /partners/{id}/memories:
    get:
      consumes:
      - application/json
      description: 指定されたIDのパートナーの思い出ログ一覧を返します
      parameters:
      - description: Partner ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/girlfriend-backend_internal_domain_model.Memory'
            type: array
      summary: 思い出の取得
      tags:
      - partners
  /sleep/end:
    post:
      consumes:
      - application/json
      description: 睡眠を終了し、睡眠時間を計算して記録します
      parameters:
      - description: パートナーID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interface_handler.SleepRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/girlfriend-backend_internal_domain_model.SleepLog'
      summary: おはよう（起床）
      tags:
      - sleep
  /sleep/start:
    post:
      consumes:
      - application/json
      description: 指定されたパートナーの睡眠計測を開始します
      parameters:
      - description: パートナーID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interface_handler.SleepRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/girlfriend-backend_internal_domain_model.SleepLog'
      summary: おやすみ（睡眠開始）
      tags:
      - sleep
swagger: "2.0"
